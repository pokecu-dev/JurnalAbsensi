<svg xmlns="http://www.w3.org/2000/svg" width="600" height="850" viewBox="0 0 600 850" role="img" aria-label="Dummy foto surat keterangan sakit">
  <rect width="600" height="850" fill="#e8e6e0"/>
  <g transform="rotate(-1 300 425)">
    <rect x="46" y="34" width="508" height="782" fill="#ffffff" stroke="#d8d4ca"/>
    <rect x="46" y="34" width="508" height="782" fill="#fbfaf6" opacity="0.7"/>

    <text x="300" y="92" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="bold" fill="#1f2a37">SMA NEGERI 1 CONTOH</text>
    <text x="300" y="118" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#4b5563">Jalan Pendidikan No. 123, Kabupaten Contoh</text>
    <line x1="80" y1="134" x2="520" y2="134" stroke="#1f2a37" stroke-width="2"/>

    <text x="300" y="192" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" letter-spacing="1" fill="#111827">SURAT KETERANGAN SAKIT</text>
    <text x="300" y="218" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#374151">Nomor: 421/SGT/SMAN1C/2026</text>

    <g font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1f2a37">
      <text x="86" y="278">Yang bertanda tangan di bawah ini,</text>
      <text x="86" y="312">dokter yang bertugas di Puskesmas Contoh,</text>
      <text x="86" y="346">dengan ini menerangkan bahwa:</text>

      <text x="110" y="400" font-weight="bold">Nama</text>
      <text x="250" y="400">: Ahmad Rizki</text>
      <text x="110" y="430" font-weight="bold">Kelas</text>
      <text x="250" y="430">: XI RPL 2</text>
      <text x="110" y="460" font-weight="bold">NIS</text>
      <text x="250" y="460">: 2024100123</text>

      <text x="86" y="514">berdasarkan pemeriksaan, siswa tersebut</text>
      <text x="86" y="544">sedang sakit dan dianjurkan beristirahat di</text>
      <text x="86" y="574">rumah selama 1 (satu) hari.</text>
    </g>

    <g font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1f2a37">
      <text x="86" y="634">Demikian surat ini dibuat untuk dapat</text>
      <text x="86" y="660">dipergunakan sebagaimana mestinya.</text>
    </g>

    <g font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1f2a37">
      <text x="392" y="620" text-anchor="middle">Contoh, 9 Oktober 2026</text>
      <text x="392" y="646" text-anchor="middle">Dokter Pemeriksa,</text>
      <path d="M336 706 c14 -26 26 -34 34 -14 c6 16 -4 34 -16 40 c-14 8 -28 -2 -22 -18 c6 -16 30 -30 52 -34 c16 -3 30 4 42 18"
            fill="none" stroke="#1d4ed8" stroke-width="2.4" stroke-linecap="round"/>
      <text x="392" y="744" text-anchor="middle" font-weight="bold">(dr. Siti Amalia, Sp.A)</text>
      <text x="392" y="766" text-anchor="middle" font-size="12">NIP 19870512 201402 2 003</text>
    </g>

    <g opacity="0.55" transform="rotate(-12 430 700)">
      <circle cx="430" cy="700" r="52" fill="none" stroke="#1d4ed8" stroke-width="3"/>
      <circle cx="430" cy="700" r="43" fill="none" stroke="#1d4ed8" stroke-width="1.2"/>
      <text x="430" y="694" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">PUSKESMAS</text>
      <text x="430" y="712" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">CONTOH</text>
    </g>
  </g>
</svg>
