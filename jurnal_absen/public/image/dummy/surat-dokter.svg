<svg xmlns="http://www.w3.org/2000/svg" width="600" height="850" viewBox="0 0 600 850" role="img" aria-label="Dummy foto surat keterangan dokter">
  <rect width="600" height="850" fill="#e4e6e3"/>
  <g transform="rotate(-2 300 425)">
    <rect x="44" y="32" width="512" height="786" fill="#ffffff" stroke="#d5d7d2"/>
    <rect x="44" y="32" width="512" height="786" fill="#fafcfb" opacity="0.75"/>

    <rect x="44" y="32" width="512" height="8" fill="#0f766e"/>

    <text x="300" y="104" text-anchor="middle" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#0f3d3a">RSUD CONTOH SEHAT</text>
    <text x="300" y="130" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#4b5563">Poliklinik Umum &middot; Jl. Kesehatan No. 9, Kabupaten Contoh</text>
    <line x1="80" y1="148" x2="520" y2="148" stroke="#0f766e" stroke-width="2"/>

    <text x="300" y="208" text-anchor="middle" font-family="'Courier New', monospace" font-size="21" font-weight="bold" fill="#111827">SURAT KETERANGAN DOKTER</text>
    <text x="300" y="234" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#374151">No. 045/RSUD/2026/10</text>

    <g font-family="'Courier New', monospace" font-size="15" fill="#1f2a37">
      <text x="84" y="292">Dokter yang bertugas memberikan</text>
      <text x="84" y="320">keterangan bahwa:</text>

      <text x="108" y="374" font-weight="bold">Nama</text>
      <text x="250" y="374">: Budi Santoso</text>
      <text x="108" y="404" font-weight="bold">Kelas</text>
      <text x="250" y="404">: XI RPL 2</text>
      <text x="108" y="434" font-weight="bold">Diagnosa</text>
      <text x="250" y="434">: ISPA ringan</text>

      <text x="84" y="492">Pasien diminta istirahat total di rumah</text>
      <text x="84" y="520">dan kontrol kembali apabila keluhan</text>
      <text x="84" y="548">tidak membaik dalam 3 (tiga) hari.</text>

      <text x="84" y="606">Surat ini berlaku untuk keperluan</text>
      <text x="84" y="634">ketidakhadiran di sekolah.</text>
    </g>

    <g font-family="'Courier New', monospace" font-size="14" fill="#1f2a37">
      <text x="394" y="622" text-anchor="middle">Contoh, 9 Oktober 2026</text>
      <text x="394" y="650" text-anchor="middle">Dokter,</text>
      <path d="M334 714 c16 -30 30 -36 38 -16 c8 20 -4 40 -20 46 c-16 6 -28 -8 -20 -24 c8 -16 34 -30 56 -32"
            fill="none" stroke="#0f766e" stroke-width="2.4" stroke-linecap="round"/>
      <text x="394" y="756" text-anchor="middle" font-weight="bold">(dr. Bagus Prakoso, Sp.P)</text>
      <text x="394" y="778" text-anchor="middle" font-size="11">NIP 19811020 201001 1 008</text>
    </g>

    <g opacity="0.5" transform="rotate(-14 424 706)">
      <circle cx="424" cy="706" r="54" fill="none" stroke="#0f766e" stroke-width="3"/>
      <circle cx="424" cy="706" r="45" fill="none" stroke="#0f766e" stroke-width="1.2"/>
      <text x="424" y="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#0f766e">RSUD</text>
      <text x="424" y="718" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#0f766e">CONTOH</text>
    </g>
  </g>
</svg>
