<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Info Jurnal</title>
<style>
  :root{
    --sidebar-bg: #16231d;
    --sidebar-active-border: #4f7cff;
    --sidebar-active-bg: #3a6df0;
    --sidebar-text: #cfd8d2;
    --bg: #f1ead9;
    --dark-input: #2c4136;
    --card-bg: #ffffff;
    --mint: #b7dfca;
    --mint-dark: #7fc7a2;
    --tag-mint: #a9e0c4;
    --tag-tan: #f0dcae;
    --text-dark: #1c2620;
    --text-muted: #6b7570;
    --border: #e7e0cf;
    --red: #e0392f;
    --red-bg: #f6cfcb;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text-dark);
  }

  .layout{ display:flex; min-height:100vh; }

  /* SIDEBAR */
  .sidebar{
    width:240px;
    background: var(--sidebar-bg);
    padding: 24px 16px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    position: sticky;
    top:0;
    height:100vh;
  }

  .nav-list{ display:flex; flex-direction:column; gap:10px; }

  .nav-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 14px;
    border-radius:10px;
    color: var(--sidebar-text);
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    border: 1px solid transparent;
    background: transparent;
    transition: background .15s ease, border-color .15s ease;
  }

  .nav-item:hover{ background: rgba(255,255,255,0.04); }

  .nav-item.active .icon{
    background: var(--sidebar-active-bg);
    border-radius:8px;
    color:#fff;
  }
  .nav-item.active{ color:#fff; }

  .nav-item .icon{
    width:28px; height:28px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    border-radius:8px;
  }

  .sidebar-bottom{ display:flex; flex-direction:column; gap:10px; }

  .sidebar-btn{
    display:flex; align-items:center; gap:10px;
    padding:12px 14px;
    border-radius:10px;
    background: #3a4c42;
    color: #e7ece9;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    border:none;
    justify-content:flex-start;
  }
  .sidebar-btn:hover{ background:#455a4f; }

  /* MAIN */
  .main{ flex:1; min-width:0; }

  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding: 24px 40px;
    border-bottom: 1px solid var(--border);
  }

  .topbar h1{ margin:0 0 4px 0; font-size:22px; font-weight:700; }
  .topbar p{ margin:0; color: var(--text-muted); font-size:14px; }

  .topbar-right{ display:flex; align-items:center; gap:14px; text-align:right; }
  .bell{ width:20px; height:20px; color:#3a4c42; }
  .datetime{ font-size:14px; }
  .datetime .date{ font-weight:600; }
  .datetime .time{ color:var(--text-muted); margin-top:2px; }

  .content{ padding: 32px 40px 48px; }

  /* SELECT ROW */
  .select-row{
    display:grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 24px;
    max-width: 900px;
  }

  .field label{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:14px;
    font-weight:700;
    margin-bottom:10px;
  }

  .field label .lbl-icon{ width:16px; height:16px; color:var(--text-dark); }

  .dark-select{
    background: var(--dark-input);
    color:#fff;
    border-radius:10px;
    padding: 12px 16px;
    font-size:15px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
  }

  .dark-select .sub{
    font-size:12px;
    font-weight:500;
    color:#cfd8d2;
    margin-top:2px;
  }

  .dark-select svg{ opacity:0.8; flex-shrink:0; }

  .hint{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color: var(--text-muted);
    margin-top:20px;
  }
  .hint svg{ flex-shrink:0; }

  /* PANELS */
  .panel{
    background: var(--card-bg);
    border-radius:16px;
    margin-top:28px;
    padding: 26px 32px 30px;
    border: 1px solid var(--border);
  }

  .panel-title{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:17px;
    font-weight:700;
    margin: 0 0 22px 0;
    padding-bottom:16px;
    border-bottom: 1px solid var(--border);
  }

  .form-row{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 32px;
  }

  .form-field label{
    display:block;
    font-size:14px;
    font-weight:700;
    margin-bottom:10px;
  }
  .form-field label .req{ color: var(--red); }

  textarea{
    width:100%;
    min-height: 110px;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    font-size:14px;
    font-family: inherit;
    resize: vertical;
    color: var(--text-dark);
    background:#fff;
  }
  textarea::placeholder{ color:#a7ad9f; }
  textarea:focus{ outline: 2px solid var(--mint-dark); outline-offset:1px; }

  .tags{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:16px;
  }

  .tag{
    padding: 8px 16px;
    border-radius: 20px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    border:none;
    color: var(--text-dark);
  }
  .tag.mint{ background: var(--tag-mint); }
  .tag.tan{ background: var(--tag-tan); }
  .tag:hover{ filter: brightness(0.96); }

  /* ATTENDANCE PANEL */
  .att-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:14px;
    padding-bottom:16px;
    border-bottom: 1px solid var(--border);
    margin-bottom:0;
  }

  .att-title{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:17px;
    font-weight:700;
  }

  .att-stats{
    display:flex;
    align-items:center;
    gap:14px;
    background: #faf3e4;
    border-radius: 20px;
    padding: 8px 18px;
    font-size:13px;
    font-weight:600;
    color: var(--text-dark);
  }
  .att-stats .divider{ width:1px; height:14px; background:#d8cfb8; }
  .att-stats .dot{
    display:inline-block; width:8px; height:8px; border-radius:50%;
    margin-right:6px;
  }
  .att-stats .dot.total{ background:#2c4136; }
  .att-stats .dot.absen{ background: var(--red); }

  table{ width:100%; border-collapse: collapse; margin-top:18px; }

  thead th{
    text-align:left;
    font-size:12px;
    color: var(--text-muted);
    background: #f7f1e2;
    padding: 12px 16px;
    font-weight:700;
  }
  thead th:first-child{ border-radius:8px 0 0 8px; width:70px; text-align:center; }
  thead th:last-child{ border-radius:0 8px 8px 0; }

  tbody td{
    padding: 16px;
    font-size:14px;
    border-bottom: 1px solid var(--border);
  }
  tbody tr:last-child td{ border-bottom:none; }
  tbody td:first-child{ text-align:center; color:var(--text-muted); }

  .siswa-name{ font-weight:700; }

  .ket-pill{
    display:inline-block;
    padding: 5px 14px;
    border-radius: 16px;
    font-size:13px;
    font-weight:600;
  }
  .ket-pill.sakit{ background: var(--red-bg); color: var(--red); }
  .ket-pill.izin{ background: #fde6c2; color:#b3691a; }
  .ket-pill.alpha{ background:#e6e0d0; color:#5a5347; }

  @media (max-width: 900px){
    .select-row{ grid-template-columns:1fr; }
    .form-row{ grid-template-columns:1fr; }
    .sidebar{ width:80px; }
    .nav-item span:not(.icon), .sidebar-btn span:not(.icon){ display:none; }
  }
</style>
</head>
<body>
<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <nav class="nav-list">
      <div class="nav-item">
        <span class="icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        </span>
        <span>Home</span>
      </div>
      <div class="nav-item active">
        <span class="icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        </span>
        <span>Info</span>
      </div>
    </nav>

    <div class="sidebar-bottom">
      <button class="sidebar-btn">
        <span class="icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0114 0v1"/></svg>
        </span>
        <span>Profile</span>
      </button>
      <button class="sidebar-btn">
        <span class="icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        </span>
        <span>Logout</span>
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <header class="topbar">
      <div>
        <h1>Detail Info Jurnal</h1>
        <p>Semangat mengajar hari ini!</p>
      </div>
      <div class="topbar-right">
        <svg class="bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        <div class="datetime">
          <div class="date">Selasa, 21 Juli 2026</div>
          <div class="time">08.00 WIB</div>
        </div>
      </div>
    </header>

    <div class="content">

      <!-- SELECT ROW -->
      <section class="select-row">
        <div class="field">
          <label>
            <svg class="lbl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 20v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 20v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
            Kelas
          </label>
          <div class="dark-select">
            <span>XI RPL 2</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M8 10l3 3 5-5"/></svg>
          </div>
        </div>

        <div class="field">
          <label>
            <svg class="lbl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
            Mata Pelajaran
          </label>
          <div class="dark-select">
            <span>Matematika</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M8 10l3 3 5-5"/></svg>
          </div>
        </div>

        <div class="field">
          <label>
            <svg class="lbl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            Jam Ke-
          </label>
          <div class="dark-select">
            <span>
              Jam 5 - 9
              <div class="sub">09:40 - 13:00</div>
            </span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M8 10l3 3 5-5"/></svg>
          </div>
        </div>
      </section>

      <div class="hint">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>
        Data di atas terisi otomatis berdasarkan jadwal mengajar Anda saat ini.
      </div>

      <!-- DETAIL KEGIATAN -->
      <section class="panel">
        <div class="panel-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          Detail Kegiatan
        </div>

        <div class="form-row">
          <div class="form-field">
            <label>Materi Pembelajaran <span class="req">*</span></label>
            <textarea placeholder="Fungsi kuadrat ...."></textarea>
          </div>
          <div class="form-field">
            <label>Keterangan / Aktivitas Kelas</label>
            <textarea placeholder="Catatan kegiatan..."></textarea>
            <div class="tags">
              <button class="tag mint">Penjelasan</button>
              <button class="tag tan">Diskusi Kelompok</button>
              <button class="tag tan">Latihan Soal</button>
              <button class="tag tan">Ulangan Harian</button>
            </div>
          </div>
        </div>
      </section>

      <!-- ABSENSI -->
      <section class="panel">
        <div class="att-header">
          <div class="att-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
            Daftar Siswa Tidak Hadir
          </div>
          <div class="att-stats">
            <span><span class="dot total"></span>Total: 36</span>
            <span class="divider"></span>
            <span><span class="dot absen"></span>Absen: 1</span>
          </div>
        </div>

        <table>
          <thead>
            <tr>
              <th>No</th>
              <th>Nama Siswa</th>
              <th>Keterangan</th>
            </tr>
          </thead>
          <tbody id="absen-body"></tbody>
        </table>
      </section>

    </div>
  </main>
</div>

<script>
const absen = [
  { nama: "Roy Kiyoshi", ket: "sakit" },
];

const ketLabel = { sakit: "Sakit", izin: "Izin", alpha: "Alpha" };

const tbody = document.getElementById('absen-body');
tbody.innerHTML = absen.map((s, i) => `
  <tr>
    <td>${i + 1}</td>
    <td class="siswa-name">${s.nama}</td>
    <td><span class="ket-pill ${s.ket}">${ketLabel[s.ket]}</span></td>
  </tr>
`).join('');
</script>

</body>
</html>
