<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Status Validasi Jurnal</title>
<style>
  :root{
    --sidebar-bg: #16231d;
    --sidebar-active-border: #4f7cff;
    --sidebar-text: #cfd8d2;
    --bg: #f1ead9;
    --panel-dark: #2c4136;
    --card-bg: #ffffff;
    --mint: #b7dfca;
    --mint-dark: #7fc7a2;
    --pill-inactive: #4a5f53;
    --text-dark: #1c2620;
    --text-muted: #6b7570;
    --green: #2fae5b;
    --orange: #e08a2b;
    --orange-bg: #f3f1e9;
    --red: #e0392f;
    --border: #e7e0cf;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text-dark);
  }

  .layout{ display:flex; min-height:100vh; }

  /* SIDEBAR */
  .sidebar{
    width:240px;
    background: var(--sidebar-bg);
    padding: 24px 16px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    position: sticky;
    top:0;
    height:100vh;
  }

  .nav-list{ display:flex; flex-direction:column; gap:10px; }

  .nav-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 14px;
    border-radius:10px;
    color: var(--sidebar-text);
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    border: 1px solid transparent;
    background: transparent;
    transition: background .15s ease, border-color .15s ease;
  }

  .nav-item:hover{ background: rgba(255,255,255,0.04); }

  .nav-item.active{
    border-color: var(--sidebar-active-border);
    color: #eaf1ff;
    background: rgba(79,124,255,0.06);
  }

  .nav-item .icon{
    width:20px; height:20px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }

  .nav-spacer{ height:52px; }

  .sidebar-bottom{ display:flex; flex-direction:column; gap:10px; }

  .sidebar-btn{
    display:flex; align-items:center; gap:10px;
    padding:12px 14px;
    border-radius:10px;
    background: #3a4c42;
    color: #e7ece9;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    border:none;
    justify-content:flex-start;
  }
  .sidebar-btn:hover{ background:#455a4f; }

  /* MAIN */
  .main{ flex:1; min-width:0; }

  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding: 24px 40px;
    border-bottom: 1px solid var(--border);
  }

  .topbar h1{ margin:0 0 4px 0; font-size:22px; font-weight:700; }
  .topbar p{ margin:0; color: var(--text-muted); font-size:14px; }

  .topbar-right{ display:flex; align-items:center; gap:14px; text-align:right; }
  .bell{ width:20px; height:20px; color:#3a4c42; }
  .datetime{ font-size:14px; }
  .datetime .date{ font-weight:600; }
  .datetime .time{ color:var(--text-muted); margin-top:2px; }

  .content{ padding: 32px 40px 48px; }

  /* FILTER PANEL */
  .filter-panel{
    background: var(--panel-dark);
    border-radius:14px;
    padding: 26px 32px 22px;
    color:#fff;
  }

  .filter-title{
    font-size:22px;
    font-weight:700;
    color: var(--mint);
    margin: 0 0 18px 0;
  }

  .filter-pills{
    display:flex;
    flex-wrap:wrap;
    gap: 40px;
  }

  .pill{
    padding: 12px 26px;
    border-radius:10px;
    font-size:15px;
    font-weight:600;
    border:none;
    cursor:pointer;
    background: var(--pill-inactive);
    color: #dfe6e1;
    transition: background .15s ease, color .15s ease;
  }

  .pill:hover{ background:#57705f; }

  .pill.active{
    background: var(--mint);
    color: var(--text-dark);
  }

  /* TABLE PANEL */
  .journal-panel{
    background: var(--card-bg);
    border-radius:16px;
    margin-top:28px;
    padding: 24px 28px 20px;
    border: 1px solid var(--border);
  }

  .journal-panel h2{ font-size:16px; font-weight:700; margin: 0 0 16px 0; }

  table{ width:100%; border-collapse: collapse; }

  thead th{
    text-align:left;
    font-size:12px;
    letter-spacing:0.3px;
    color: var(--text-dark);
    background: #eef2ec;
    padding: 12px 14px;
    font-weight:700;
  }
  thead th:first-child{ border-radius:8px 0 0 8px; }
  thead th:last-child{ border-radius:0 8px 8px 0; text-align:center; }

  tbody td{
    padding: 16px 14px;
    font-size:14px;
    border-bottom: 1px solid var(--border);
  }
  tbody tr:last-child td{ border-bottom:none; }

  .status-icon{ width:22px; height:22px; display:flex; align-items:center; justify-content:center; }
  .subject{ font-weight:700; }
  .status{ font-weight:700; }
  .status.ok{ color: var(--green); }
  .status.pending{ color: var(--orange); }
  .status.reject{ color: var(--red); }
  .keterangan{ color: var(--text-muted); }
  .aksi{ text-align:center; }

  .aksi-btn{
    display:inline-flex; align-items:center; gap:6px;
    background: var(--orange-bg);
    color: var(--text-dark);
    border:none;
    padding:8px 14px;
    border-radius:8px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .aksi-btn:hover{ background:#e9e5d7; }

  .empty-state{
    text-align:center;
    padding: 40px 0;
    color: var(--text-muted);
    font-size:14px;
  }

  @media (max-width: 900px){
    .sidebar{ width:80px; }
    .nav-item span:not(.icon), .sidebar-btn span:not(.icon){ display:none; }
    table{ font-size:12px; }
    .filter-pills{ gap:14px; }
    .pill{ padding:10px 16px; }
  }
</style>
</head>
<body>
<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <nav class="nav-list">
      <div class="nav-item">
        <span class="icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        </span>
        <span>Home</span>
      </div>
      <div class="nav-item">
        <span class="icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        </span>
        <span>Info</span>
      </div>
      <div class="nav-item active">
        <span class="icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        </span>
        <span>Validasi</span>
      </div>
    </nav>

    <div class="sidebar-bottom">
      <button class="sidebar-btn">
        <span class="icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0114 0v1"/></svg>
        </span>
        <span>Profile</span>
      </button>
      <button class="sidebar-btn">
        <span class="icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        </span>
        <span>Logout</span>
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <header class="topbar">
      <div>
        <h1>Selamat Datang, pak Budi</h1>
        <p>Semangat mengajar hari ini!</p>
      </div>
      <div class="topbar-right">
        <svg class="bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        <div class="datetime">
          <div class="date">Selasa, 21 Juli 2026</div>
          <div class="time">08.00 WIB</div>
        </div>
      </div>
    </header>

    <div class="content">

      <!-- FILTER PANEL -->
      <section class="filter-panel">
        <div class="filter-title">Filter:</div>
        <div class="filter-pills">
          <button class="pill active" data-filter="all">All</button>
          <button class="pill" data-filter="pending">Waiting</button>
          <button class="pill" data-filter="ok">Validated</button>
          <button class="pill" data-filter="reject">Denied</button>
        </div>
      </section>

      <!-- TABLE PANEL -->
      <section class="journal-panel">
        <h2>Table</h2>
        <table>
          <thead>
            <tr>
              <th style="width:44px;"></th>
              <th>MATA PELAJARAN</th>
              <th>KELAS</th>
              <th>JAM PEMBELAJARAN</th>
              <th>STATUS</th>
              <th>KETERANGAN</th>
              <th>AKSI</th>
            </tr>
          </thead>
          <tbody id="journal-body"></tbody>
        </table>
        <div class="empty-state" id="empty-state" style="display:none;">Tidak ada jurnal untuk filter ini.</div>
      </section>

    </div>
  </main>
</div>

<script>
const baseRows = [
  { subject:"MATEMATIKA", kelas:"XI PPLG 2", jam:"08.00-0840", status:"ok",      statusLabel:"Tervalidasi",       ket:"21 Juli 2026, 08.20" },
  { subject:"MATEMATIKA", kelas:"XI PPLG 1", jam:"09.00-09.40", status:"ok",      statusLabel:"Tervalidasi",       ket:"21 Juli 2026, 08.40" },
  { subject:"MATEMATIKA", kelas:"XI TKJ 2",  jam:"10.00-10.40", status:"pending", statusLabel:"Menunggu Validasi", ket:"21 Juli 2026, 09.30" },
  { subject:"MATEMATIKA", kelas:"XI TKI 2",  jam:"11.00-11.40", status:"reject",  statusLabel:"Perlu Diperbaiki",  ket:"21 Juli 2026, 09.30" },
];

// ulangi pola data seperti pada tampilan referensi
const rows = [...baseRows, ...baseRows, ...baseRows];

const icons = {
  ok: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2fae5b" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/></svg>`,
  pending: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#e08a2b" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M12 7v5l3 2"/></svg>`,
  reject: `<svg width="20" height="20" viewBox="0 0 24 24" fill="#e0392f"><circle cx="12" cy="12" r="10"/><rect x="11" y="6" width="2" height="7" fill="#fff"/><rect x="11" y="15" width="2" height="2" fill="#fff"/></svg>`,
};

const tbody = document.getElementById('journal-body');
const emptyState = document.getElementById('empty-state');
const pills = document.querySelectorAll('.pill');

function renderRows(filter){
  const filtered = filter === 'all' ? rows : rows.filter(r => r.status === filter);

  if(filtered.length === 0){
    tbody.innerHTML = '';
    emptyState.style.display = 'block';
    return;
  }
  emptyState.style.display = 'none';

  tbody.innerHTML = filtered.map(r => `
    <tr>
      <td class="status-icon">${icons[r.status]}</td>
      <td class="subject">${r.subject}</td>
      <td>${r.kelas}</td>
      <td>${r.jam}</td>
      <td class="status ${r.status}">${r.statusLabel}</td>
      <td class="keterangan">${r.ket}</td>
      <td class="aksi">
        <button class="aksi-btn">
          Detail
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </td>
    </tr>
  `).join('');
}

pills.forEach(pill => {
  pill.addEventListener('click', () => {
    pills.forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    renderRows(pill.dataset.filter);
  });
});

renderRows('all');
</script>

</body>
</html>
